## API Security Gateway — Application Configuration

# ─── Server ──────────────────────────────────────────────────────
server.port=8080

# ─── Application name ────────────────────────────────────────────
spring.application.name=api-security-gateway

# ─── Actuator ────────────────────────────────────────────────────
# Expose the built-in /actuator/health endpoint (separate from our custom /api/health)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Logging ─────────────────────────────────────────────────────
logging.level.com.krishna.gateway=DEBUG
logging.level.root=INFO

