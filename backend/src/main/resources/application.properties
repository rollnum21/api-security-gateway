## Target Backend API — Application Configuration

# ─── Server ──────────────────────────────────────────────────────
# Port 3000: intentionally different from the gateway (8080).
# In production, only the gateway (8080) should be exposed to clients.
# This port should be accessible only from the gateway internally.
server.port=3000

# ─── Application name ────────────────────────────────────────────
spring.application.name=target-backend-api

# ─── Logging ─────────────────────────────────────────────────────
logging.level.com.krishna.backend=DEBUG
logging.level.root=INFO
